# Конфігурація корпоративного маршрутизатора (Варіант 18)
HOST gw-kremenchuk-01

# Фізичні інтерфейси
IFACE eth0 192.168.10.1/24 aa-bb-cc-10-00-01 mtu=1500 bw=1000 up
IFACE eth1 10.20.0.1/16 aa-bb-cc-10-00-02 mtu=1500 bw=2500 up
IFACE eth2 172.16.5.1/24 aa-bb-cc-10-00-03 mtu=1400 bw=1000 down

# Логічні VLAN-інтерфейси
VLAN eth0.20 parent=eth0 vlan=20 192.168.20.1/24 aa-bb-cc-10-00-11 mtu=1500 bw=1000 up
VLAN eth0.30 parent=eth0 vlan=30 192.168.30.1/24 aa-bb-cc-10-00-12 mtu=1500 bw=500 up

# Статичні маршрути
ROUTE 10.100.0.0/16 via 192.168.10.254 dev eth0 metric=10 up
ROUTE 172.31.0.0/16 via 10.20.0.254 dev eth1 metric=20 up
ROUTE 192.168.200.0/24 via 192.168.20.254 dev eth0.20 metric=50 up
ROUTE 0.0.0.0/0 via 192.168.10.254 dev eth0 metric=100 up